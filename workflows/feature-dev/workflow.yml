# Framework configuration
framework:
  path: framework/merged-universal-ai-assisted-software-build-framework.md
  loader: universal-framework-loader
  phases:
    phase0: ideation, risk, invariants
    phase1: requirements, scope, api, permissions
    phase2: stack, data, state, concurrency
    phase3: backend, data, observability, testing, ci-cd, guardrails
    phase4: slice, swarm, commits
    phase5: validation, integrity, security, safety
    phase6: ui-state, ux
    phase7: release, staging, production
    phase8: monitoring, debt, quality

# Execution mandates (non-negotiable)
mandates:
  opencode_cli_required: true
  ralph_loops_required: true
  rl_threshold: 95
  sacred_docs_updated: true

# Swarm configuration
swarm:
  max_depth: 2
  max_sub_agents_per_parent: 3
  merge_strategy: deduplicate
  status_reporting: swimlane
