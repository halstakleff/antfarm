# Ralph loop (https://github.com/snarktank/ralph) — each agent runs in a fresh
# session with clean context. Memory persists via git history and progress files.
id: feature-dev
name: Feature Development Workflow
version: 6
description: |
  SUPER CODING TEAM: Story-based execution with Ralph loops and Microsoft RL scoring.
  Architect designs → Researcher explores → Developer (Tech Lead) builds with OpenCode CLI
  → Debugger-Optimizer audits → Verifier checks with RL scoring.
  Each agent uses Ralph loops, must achieve RL score >= 95.

polling:
  model: default
  timeoutSeconds: 10800

agents:
  - id: planner
    name: Planner
    role: analysis
    description: Decomposes tasks into ordered user stories.
    workspace:
      baseDir: agents/planner
      files:
        AGENTS.md: agents/planner/AGENTS.md
        SOUL.md: agents/planner/SOUL.md
        IDENTITY.md: agents/planner/IDENTITY.md

  - id: setup
    name: Setup
    role: coding
    description: Prepares environment, creates branch, establishes baseline.
    workspace:
      baseDir: agents/setup
      files:
        AGENTS.md: ../../agents/shared/setup/AGENTS.md
        SOUL.md: ../../agents/shared/setup/SOUL.md
        IDENTITY.md: ../../agents/shared/setup/IDENTITY.md

  - id: developer
    name: Developer
    role: coding
    description: Implements features, writes tests, creates PRs. Uses OpenCode CLI + Ralph loops.
    workspace:
      baseDir: agents/developer
      files:
        AGENTS.md: agents/developer/AGENTS.md
        SOUL.md: agents/developer/SOUL.md
        IDENTITY.md: agents/developer/IDENTITY.md
        RL_LOOP.md: agents/developer/RL_LOOP.md
        ralph-loop.sh: agents/developer/ralph-loop.sh

  - id: verifier
    name: Verifier
    role: verification
    description: Quick sanity check with Microsoft RL scoring.
    workspace:
      baseDir: agents/verifier
      files:
        AGENTS.md: ../../agents/shared/verifier/AGENTS.md
        SOUL.md: ../../agents/shared/verifier/SOUL.md
        IDENTITY.md: ../../agents/shared/verifier/IDENTITY.md

  - id: tester
    name: Tester
    role: testing
    description: Integration and E2E testing after all stories are implemented.
    workspace:
      baseDir: agents/tester
      files:
        AGENTS.md: agents/tester/AGENTS.md
        SOUL.md: agents/tester/SOUL.md
        IDENTITY.md: agents/tester/IDENTITY.md

  - id: reviewer
    name: Reviewer
    role: analysis
    description: Reviews PRs, requests changes or approves.
    workspace:
      baseDir: agents/reviewer
      files:
        AGENTS.md: agents/reviewer/AGENTS.md
        SOUL.md: agents/reviewer/SOUL.md
        IDENTITY.md: agents/reviewer/IDENTITY.md

# BROWSER AGENT LAYER (ADDED FEB 2026)
  - id: browser-validator
    name: Browser Validator
    role: analysis
    description: Runs DOM extraction, schema validation, and post-deploy regression checks.
    workspace:
      baseDir: agents/browser-validation-agent
      skills:
        - renders-html-fetcher
        - dom-extractor
        - jsonld-schema-extractor
        - site-crawler
        - page-anatomy-extractor
        - llm-crawl-simulator
        - dataset-generator
        - post-deploy-validator
      files:
        AGENTS.md: agents/browser-validation-agent/AGENTS.md
        SOUL.md: agents/browser-validation-agent/SOUL.md
        IDENTITY.md: agents/browser-validation-agent/IDENTITY.md
        instructions.md: agents/browser-validation-agent/instructions.md

# SUPER CODING TEAM SUB-AGENTS (ADDED FEB 2026)
  - id: architect
    name: Architect
    role: analysis
    description: High-level design, Mermaid diagrams, JSON story decomposition.
    workspace:
      baseDir: agents/architect
      skills:
        - opencode-cli
        - ralph-loop
      files:
        AGENTS.md: agents/architect/AGENTS.md
        SOUL.md: agents/architect/SOUL.md
        IDENTITY.md: agents/architect/IDENTITY.md

  - id: researcher
    name: Researcher
    role: analysis
    description: Web/codebase research, dependency analysis, pattern discovery.
    workspace:
      baseDir: agents/researcher
      files:
        AGENTS.md: agents/researcher/AGENTS.md
        SOUL.md: agents/researcher/SOUL.md
        IDENTITY.md: agents/researcher/IDENTITY.md

  - id: debugger-optimizer
    name: Debugger-Optimizer
    role: coding
    description: Root-cause analysis, RL-scored performance/security audits.
    workspace:
      baseDir: agents/debugger-optimizer
      files:
        AGENTS.md: agents/debugger-optimizer/AGENTS.md
        SOUL.md: agents/debugger-optimizer/SOUL.md
        IDENTITY.md: agents/debugger-optimizer/IDENTITY.md

# Main developer enhanced with new skills
  - id: developer-super
    name: Developer (Super Team)
    role: coding
    description: Tech Lead that uses OpenCode CLI, Ralph loops, and RL scoring.
    workspace:
      baseDir: agents/developer
      files:
        AGENTS.md: agents/developer/AGENTS.md
        SOUL.md: agents/developer/SOUL.md
        IDENTITY.md: agents/developer/IDENTITY.md

steps:
  - id: plan
    agent: planner
    input: |
      Decompose the following task into ordered user stories for autonomous execution.

      TASK:
      {{task}}

      Instructions:
      1. Explore the codebase to understand the stack, conventions, and patterns
      2. Break the task into small user stories (max 20)
      3. Order by dependency: schema/DB first, backend, frontend, integration
      4. Each story must fit in one developer session (one context window)
      5. Every acceptance criterion must be mechanically verifiable
      6. Always include "Typecheck passes" as the last criterion in every story
      7. Every story MUST include test criteria — "Tests for [feature] pass"
      8. The developer is expected to write tests as part of each story

      Reply with:
      STATUS: done
      REPO: /path/to/repo
      BRANCH: feature-branch-name
      STORIES_JSON: [ ... array of story objects ... ]
    expects: "STATUS: done"
    max_retries: 2
    on_fail:
      escalate_to: human

  - id: setup
    agent: setup
    input: |
      Prepare the development environment for this feature.

      TASK:
      {{task}}

      REPO: {{repo}}
      BRANCH: {{branch}}

      Instructions:
      1. cd into the repo
      2. Create the feature branch (git checkout -b {{branch}})
      3. Read package.json, CI config, test config to understand the build/test setup
      4. Ensure .gitignore exists — if missing, create one appropriate for the detected stack (must include .env, node_modules/, *.key, *.pem at minimum)
      5. Run the build to establish a baseline
      6. Run the tests to establish a baseline
      7. Report what you found

      Reply with:
      STATUS: done
      BUILD_CMD: <build command>
      TEST_CMD: <test command>
      CI_NOTES: <brief CI notes>
      BASELINE: <baseline status>
    expects: "STATUS: done"
    max_retries: 2
    on_fail:
      escalate_to: human

  - id: architect
    agent: architect
    input: |
      Design system architecture and decompose into stories.
      TASK: {{task}}

      Instructions:
      1. Explore existing codebase
      2. Design architecture with Mermaid diagrams
      3. Decompose into <500 LOC stories
      4. Order by dependency
      5. Create ARCHITECTURE.md
      6. Use Ralph loops until RL score >= 95

      Reply with STATUS: designed, ARCHITECTURE, STORIES_JSON, RL_SCORE
    expects: "STATUS: designed"
    max_retries: 2
    rl_threshold: 95

  - id: research
    agent: researcher
    input: |
      Research codebase, dependencies, and patterns.
      TASK: {{task}}

      Instructions:
      1. Map file structure and conventions
      2. Research required APIs/libraries
      3. Identify reusable patterns
      4. Flag risks and unknowns
      5. Create PROJECT_KB.md
      6. Use Ralph loops

      Reply with STATUS: researched, PROJECT_KB, PATTERNS, DEPENDENCIES, RISKS, RL_SCORE
    expects: "STATUS: researched"
    max_retries: 1

  - id: tiered-verify
    agent: verifier
    name: "Tiered Verification Gate"
    description: Auto-detect FAST/STRICT, apply verification, block if required
    input: |
      TASK: {{task}}
      FILES_CHANGED: {{changes}}

      Run tiered verification gate:
      1. Detect if task triggers FAST or STRICT mode
      2. Determine required V-level (V1, V2, V3)
      3. Check hash cache for redundant verification
      4. Apply appropriate verification level
      5. Assign severity (S0-S3) and confidence
      6. STRICT mode requires artifact in outputs/verification/
      7. If STRICT + no artifact: BLOCK
      8. If S0 or S1: BLOCK with remediation

      Output: verification_report.json with mode, v_level, severity, status
    expects: "STATUS: verified"
    on_fail:
      retry_step: architect
      max_retries: 2

  - id: implement
    agent: developer
    type: loop
    loop:
      over: stories
      completion: all_done
      fresh_session: true
      verify_each: true
      verify_step: verify
      loop_type: ralph
      rl_threshold: 95
      max_iterations: 5
    input: |
      Implement the following user story. You are working on ONE story in a fresh session.

      TASK (overall):
      {{task}}

      REPO: {{repo}}
      BRANCH: {{branch}}
      BUILD_CMD: {{build_cmd}}
      TEST_CMD: {{test_cmd}}

      CURRENT STORY:
      {{current_story}}

      COMPLETED STORIES:
      {{completed_stories}}

      STORIES REMAINING: {{stories_remaining}}

      VERIFY FEEDBACK (if retrying):
      {{verify_feedback}}

      PROGRESS LOG:
      {{progress}}

      Instructions:
      1. Read progress-{{run_id}}.txt — especially the Codebase Patterns section
      2. Pull latest on the branch
      3. Implement this story only
      4. Write tests for this story's functionality
      5. Run typecheck / build
      6. Run tests to confirm they pass
      7. Commit: feat: {{current_story_id}} - {{current_story_title}}
      8. Append to progress-{{run_id}}.txt
      9. Update Codebase Patterns if you found reusable patterns

      Reply with:
      STATUS: done
      CHANGES: what you implemented
      TESTS: what tests you wrote
    expects: "STATUS: done"
    max_retries: 2
    on_fail:
      escalate_to: human

  - id: verify
    agent: verifier
    input: |
      Verify the developer's work on this story.

      TASK (overall):
      {{task}}

      REPO: {{repo}}
      BRANCH: {{branch}}
      CHANGES: {{changes}}
      TEST_CMD: {{test_cmd}}

      CURRENT STORY:
      {{current_story}}

      PROGRESS LOG:
      {{progress}}

      Check:
      1. Code exists (not just TODOs or placeholders)
      2. Each acceptance criterion for the story is met
      3. Tests were written for this story's functionality
      4. Tests pass (run {{test_cmd}})
      5. No obvious incomplete work
      6. Typecheck passes

      ## Visual Verification (Frontend Changes)
      Has frontend changes: {{has_frontend_changes}}

      If {{has_frontend_changes}} is 'true', you MUST also perform visual verification:
      1. Use the agent-browser skill to visually inspect the changed UI
      2. Open the changed HTML file directly (file:// URL) or spin up a local dev server if the project requires one
      3. Take a screenshot of the rendered page
      4. Visually confirm:
         - Layout renders correctly (no broken/overlapping elements)
         - Styling is applied as expected (colors, fonts, spacing)
         - All visible elements from the story are present and properly positioned
         - No missing images, icons, or visual assets
         - Text is readable and not clipped or hidden
      5. A visual PASS means: the page renders without broken layout, missing elements, or overlapping content
      6. A visual FAIL means: broken layout, missing/invisible elements, overlapping or misaligned content, unstyled raw HTML, or obvious rendering errors
      7. Include your visual findings in VERIFIED output

      If {{has_frontend_changes}} is 'false', skip visual verification entirely.

      Reply with:
      STATUS: done
      VERIFIED: What you confirmed

      Or if incomplete:
      STATUS: retry
      ISSUES:
      - What's missing or incomplete
    expects: "STATUS: done"
    on_fail:
      retry_step: implement
      max_retries: 2
      on_exhausted:
        escalate_to: human

  - id: plankton-gate
    agent: verifier
    input: |
      Run Plankton quality gates after code changes.

      TASK: {{task}}
      REPO: {{repo}}
      BRANCH: {{branch}}
      CHANGES: {{changes}}

      Instructions:
      1. Run quality gate: ./tools/quality/gate.sh --output outputs/quality/{{timestamp}}
      2. Read quality_report.json
      3. If S0 > 0 or S1 > 0: BLOCK and return remediation instructions
      4. Print summary: S0, S1, S2, S3 counts
      5. Calculate RL score: 95 if S0=0 and S1=0

      Reply with:
      STATUS: done|fail
      GATE_STATUS: pass|fail
      S0: <count>
      S1: <count>
      S2: <count>
      S3: <count>
      RL_SCORE: <0-100>
      RECOMMENDATION: <fix instructions if failed>
    expects: "GATE_STATUS: pass"
    condition: "{{changes}} != ''"
    on_fail:
      retry_step: implement
      max_retries: 3

  - id: test
    agent: tester
    input: |
      Integration and E2E testing of the implementation.

      TASK:
      {{task}}

      REPO: {{repo}}
      BRANCH: {{branch}}
      CHANGES: {{changes}}
      BUILD_CMD: {{build_cmd}}
      TEST_CMD: {{test_cmd}}

      PROGRESS LOG:
      {{progress}}

      Your job (integration/E2E testing — unit tests were already written per-story):
      1. Run the full test suite ({{test_cmd}}) to confirm everything passes together
      2. Look for integration issues between stories
      3. If this is a UI feature, use agent-browser to test it end-to-end
      4. Check cross-cutting concerns: error handling, edge cases across features
      5. Verify the overall feature works as a cohesive whole

      Reply with:
      STATUS: done
      RESULTS: What you tested and the outcomes

      Or if issues found:
      STATUS: retry
      FAILURES:
      - Specific test failures or bugs found
    expects: "STATUS: done"
    on_fail:
      retry_step: implement
      max_retries: 2
      on_exhausted:
        escalate_to: human

  - id: debug-optimize
    agent: debugger-optimizer
    input: |
      Perform root-cause analysis and RL-scored optimization.

      TASK: {{task}}
      REPO: {{repo}}
      BRANCH: {{branch}}
      CHANGES: {{changes}}
      TEST_RESULTS: {{results}}

      Instructions:
      1. Analyze test results for failures
      2. Check for performance bottlenecks
      3. Security review (OWASP top 10)
      4. Code quality audit
      5. Propose fixes with RL scores
      6. Update PROJECT_KB.md with findings

      Reply with:
      STATUS: analyzed
      ISSUES: [list]
      FIXES: [{approach, rl_score, tradeoffs}]
      RECOMMENDED: approach
      RL_SCORE: <number>
    expects: "STATUS: analyzed"
    max_retries: 2
    rl_threshold: 90

  - id: pr
    agent: developer
    input: |
      Create a pull request for your changes.

      TASK:
      {{task}}

      REPO: {{repo}}
      BRANCH: {{branch}}
      CHANGES: {{changes}}
      RESULTS: {{results}}

      PROGRESS LOG:
      {{progress}}

      Create a PR with:
      - Clear title summarizing the change
      - Description explaining what and why
      - Reference to what was tested

      Use: gh pr create

      Reply with:
      STATUS: done
      PR: URL to the pull request
    expects: "STATUS: done"
    on_fail:
      escalate_to: human

  - id: review
    agent: reviewer
    input: |
      Review the pull request.

      PR: {{pr}}
      TASK: {{task}}
      CHANGES: {{changes}}

      PROGRESS LOG:
      {{progress}}

      Review for:
      - Code quality and clarity
      - Potential bugs or issues
      - Test coverage
      - Follows project conventions

      Use: gh pr view, gh pr diff to read the PR.

      IMPORTANT: Post your review to the PR on GitHub using:
      - If approving: gh pr review <number> --approve --body "your review summary"
      - If requesting changes: gh pr review <number> --request-changes --body "your feedback"

      ## Visual Review (Frontend Changes)
      Has frontend changes: {{has_frontend_changes}}

      If {{has_frontend_changes}} is 'true', you MUST also perform a visual design review:
      1. Check out the branch: git checkout {{branch}}
      2. Use the agent-browser skill to open the changed page (file:// URL or local dev server)
      3. Take a screenshot of the rendered page
      4. Evaluate visual polish and design quality:
         - Does the UI look polished and intentional, not rough or placeholder-quality?
         - Are colors, typography, and spacing consistent with the rest of the project?
         - Is the layout visually balanced and well-aligned?
         - Do interactive elements look clickable/tappable?
         - Is the overall design cohesive — does it feel like part of the same product?
      5. This is a DESIGN review, not a structural check — the verify step already confirmed elements render. You are checking whether the result looks GOOD.
      6. Include your visual design assessment in the review output

      If {{has_frontend_changes}} is 'false', skip visual review entirely.

      If changes needed, add comments to the PR explaining what needs to change.

      Reply with:
      STATUS: done
      DECISION: approved

      Or if changes needed:
      STATUS: retry
      DECISION: changes_requested
      FEEDBACK:
      - What needs to change
    expects: "STATUS: done"
    on_fail:
      retry_step: implement
      max_retries: 3
      on_exhausted:
        escalate_to: human


